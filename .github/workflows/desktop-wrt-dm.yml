name: Desktop + OpenWRT (Doctor Mobile / Mirage)

# Builds our byedpi fork ("Mirage" DPI-evasion core) for desktop (Windows) and
# router (OpenWRT/Linux) targets, so a future Windows/router edition can inject
# the same core. Pure C, cross-compiled with the matching gcc. v*-dm* tag.
on:
  push:
    tags: ['v*-dm*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64,   cc: gcc,                     apt: gcc }
          - { name: linux-arm64,   cc: aarch64-linux-gnu-gcc,   apt: gcc-aarch64-linux-gnu }
          - { name: linux-armv7,   cc: arm-linux-gnueabihf-gcc, apt: gcc-arm-linux-gnueabihf }
          - { name: linux-mipsle,  cc: mipsel-linux-gnu-gcc,    apt: gcc-mipsel-linux-gnu }
          - { name: linux-mips,    cc: mips-linux-gnu-gcc,      apt: gcc-mips-linux-gnu }
          - { name: windows-amd64, cc: x86_64-w64-mingw32-gcc,  apt: gcc-mingw-w64-x86-64, win: '1' }
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: Build (${{ matrix.name }})
        run: |
          make clean || true
          if [ "${{ matrix.win }}" = "1" ]; then
            make windows CC=${{ matrix.cc }}
            mv ciadpi.exe "mirage-${{ matrix.name }}.exe"
          else
            make CC=${{ matrix.cc }}
            mv ciadpi "mirage-${{ matrix.name }}"
          fi
          ls -la mirage-${{ matrix.name }}*
      - uses: actions/upload-artifact@v4
        with:
          name: mirage-${{ matrix.name }}
          path: mirage-${{ matrix.name }}*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/mirage-*
